name: bubixo
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  iconsax_flutter: ^1.0.0
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.3
  http: ^1.4.0
  flutter_bloc: ^9.1.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

# Work around the current path_provider_foundation 2.6.0 Objective-C native-asset
# loading issue on Apple platforms. Version 2.5.1 uses the plugin-based implementation.
dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/stories.json
    - assets/data/words.json
    - assets/data/grammar.json
    - assets/data/lessons.json
    - assets/data/sentence_builder.json
    - assets/data/game_words.json

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: "assets/images/app_icon_foreground_1024.png"
  web:
    generate: true
    image_path: "assets/images/app_icon_1024.png"
    background_color: "#080808"
    theme_color: "#080808"
  windows:
    generate: true
    image_path: "assets/images/app_icon_1024.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/app_icon_rounded_1024.png"
